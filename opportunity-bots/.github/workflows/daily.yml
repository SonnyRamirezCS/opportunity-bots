name: Post opportunities

on:
  schedule:
    # 15:00 UTC is 8:00 AM Pacific during daylight saving, 7:00 AM in winter.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what it would post without sending anything"
        type: boolean
        default: true

permissions:
  contents: write          # needed to commit seen.json back

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python run.py --dry-run
          else
            python run.py
          fi

      - name: Save what was posted
        if: ${{ inputs.dry_run != true }}
        run: |
          if [[ -n "$(git status --porcelain seen.json)" ]]; then
            git config user.name "opportunity-bots"
            git config user.email "actions@github.com"
            git add seen.json
            git commit -m "state: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "nothing new today"
          fi
