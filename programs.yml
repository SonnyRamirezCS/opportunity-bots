# The deadline calendar. This is the part of the bot that keeps working when
# every scraper on earth breaks, so it is worth keeping accurate.
#
# Every date below is the typical window from past cycles, NOT a confirmed
# date for this cycle. That is why date_confirmed is false everywhere. The
# bot adds a "confirm this on the site" line to any unconfirmed reminder.
#
# Once you check a program's real date, set the date and flip date_confirmed
# to true. Do a pass on this file once a semester and it stays useful for
# whoever runs the club after you.
#
# Fields:
#   name, org, url        required
#   deadline              YYYY-MM-DD
#   date_confirmed        true once you have verified it for this cycle
#   recurs_annually       true rolls the date forward every year
#   remind_days           overrides the default 45 / 21 / 7 / 2
#   roles                 which Discord roles get pinged
#   tags                  used for forum tags if you set those up
#   cc_friendly           true if community college students are eligible
#   category              internship, research, scholarship, conference, talk
#                         or transfer
#                         (if left out, the first tag is used)
#   event_date            when the thing actually happens, if that is not
#                         the same as the deadline (conferences)
#   location              shown on the post. SoCal and virtual stuff always
#                         goes in; farther away only if there is travel money
#   deadline_label        what to call the date. Defaults to "Deadline", or
#                         "Date" for talks. Use "Registration opens" etc.
#
# Talks remind 7 days and 1 day out by default. Everything else 45/21/7/2.
# The first reminder makes a forum post. Later ones reply inside it.

programs:

  # ------------------------------------------------ federal and national lab

  - name: NASA OSTEM Internships (Summer 2027)
    org: NASA
    url: https://intern.nasa.gov/
    deadline: 2027-02-26
    date_confirmed: false
    recurs_annually: true
    cc_friendly: true
    stipend: Paid, varies by center
    eligibility: US citizen, 2.9 GPA minimum, at least 16 years old, enrolled at least half time. Community college students are eligible.
    summary: One application feeds every NASA center. Pick multiple opportunities inside the portal, do not just submit one.
    notes: Start the application weeks early. It asks for a transcript and a recommender who has to submit separately.
    roles: ["Engineering", "Natural Sciences", "Computer Science"]
    tags: [internship]

  - name: DOE Community College Internships, CCI (Summer term)
    org: Department of Energy
    url: https://science.osti.gov/wdts/cci
    deadline: 2027-01-12
    date_confirmed: false
    recurs_annually: true
    cc_friendly: true
    stipend: Weekly stipend plus travel and housing help
    eligibility: Built specifically for community college students. US citizen or permanent resident, 18 or older.
    summary: Ten weeks at a national lab doing technical work with a scientist or engineer as a mentor. This is the single best fit on this list for a Pierce student.
    notes: Applications go through Zintellect. You need two recommenders and a transcript.
    roles: ["Engineering", "Natural Sciences", "Computer Science", "Math & Data", "Business"]
    tags: [internship, research]

  - name: DOE Community College Internships, CCI (Spring 2027 term)
    org: Department of Energy
    url: https://science.osti.gov/wdts/cci
    deadline: 2026-09-30
    date_confirmed: true
    recurs_annually: true
    cc_friendly: true
    stipend: Paid, 10 weeks at a national lab
    eligibility: Community college students, US citizen or permanent resident.
    summary: Ten weeks at one of 17 DOE labs, January through May, so it runs during the semester rather than over summer. Smaller cohort than the summer round and far less competition.
    notes: Closes 5:00 PM Eastern, which is 2:00 PM Pacific. The last day is really a half day. You need a transcript and recommendation letters, and recommenders submit separately, so ask them now.
    roles: ["Engineering", "Natural Sciences", "Computer Science", "Math & Data", "Business"]
    tags: [internship, research]

