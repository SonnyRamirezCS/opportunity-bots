# opportunity-bots config
# Everything you will normally touch lives in this file and programs.yml.

# "forum" makes each opportunity its own post in a forum channel.
# "text" posts them as regular messages. Use forum for #opportunities.
channel_type: forum

bot_username: Opportunity Bot
bot_avatar_url:            # optional, paste an image URL

state_file: seen.json
threads_file: threads.json   # which forum post belongs to which program
max_posts_per_run: 8       # hard cap so the channel never gets flooded
seconds_between_posts: 2

# If true, feed items that match no major role are skipped entirely.
# Leave false at first so you can see what the filters are actually catching.
require_role_match: false

# ---------------------------------------------------------------- role IDs
# Discord role IDs, not names. To get one: Server Settings > Roles > click the
# role > three dots > Copy Role ID. Developer Mode has to be on first
# (User Settings > Advanced > Developer Mode).
# Leave a role blank and it just never gets pinged.
role_ids:
  "Computer Science": "1548794882770997359"
  "Engineering": "1548794982385582181"
  "Natural Sciences": "1548795057862082621"
  "Math & Data": "1548795297415569588"
  "Business": "1548795177890480148"

# Which words in a posting cause which role to get pinged.
# A role only gets pinged when one of its words shows up, which is the whole
# point. Nobody mutes the server over notifications that are actually for them.
role_keywords:
  "Engineering":
    - engineer
    - electrical
    - hardware
    - embedded
    - firmware
    - robotics
    - mechatronics
    - controls
    - aerospace
    - circuit
    - PCB
    - FPGA
    - RF
    - mechanical
    - civil
  "Natural Sciences":
    - physics
    - astronomy
    - astrophysics
    - optics
    - photonics
    - quantum
    - materials
    - chemistry
    - chemical
    - biochem
    - biology
    - biomed
    - neuro
    - genomic
    - ecology
    - environmental
    - geology
  "Computer Science":
    - software
    - computer science
    - machine learning
    - cybersecurity
    - programming
    - backend
    - full stack
  "Math & Data":
    - mathematics
    - statistics
    - data science
    - analytics
    - computational
    - modeling
    - actuarial
  "Business":
    - business
    - finance
    - marketing
    - economics
    - supply chain

# ------------------------------------------------------------- forum tags
# The bot tags each new post automatically. Paste each tag's ID on the right.
# A tag left blank is just skipped, nothing breaks.
#
# How to get the IDs (Discord in a web browser, not the app):
#   1. Open discord.com/app in Chrome and click the #opportunities forum
#   2. Press F12, click the Network tab, type "channels" in its filter box
#   3. Press F5 to reload the page, then click the #opportunities forum again
#   4. Click the request whose name is the forum's ID, then the Preview tab
#   5. Open "available_tags". Each tag has a name and an id. Copy the ids here.
#
# Which tag goes on what:
#   internship / research / scholarship / conference / talk
#       comes from the program's category and tags in programs.yml
#   deadline
#       goes on everything you apply or submit for. Talks don't get it.
#   closed ("Closed", 1550215852111171664) is not used by the bot. Add it by
#   hand once a deadline passes; a webhook can't change tags after posting.
forum_tag_ids:
  internship: "1550215790333010011"     # Internship
  research: "1550215766819733654"       # REU
  scholarship: "1550215810830835783"    # Scholarship
  conference: "1550215836420014120"     # Conference
  talk: "1553894640208445460"           # Talk/Workshop
  deadline: "1550215732330110996"       # Deadline

# ------------------------------------------------------------------ feeds
feeds:
  # Industry internships, refreshed daily by Simplify and the Pitt CS club.
  #
  # OFF ON PURPOSE. Most of these postings want juniors and seniors at four
  # year schools, so for a room of first and second year Pierce students they
  # bury the programs people can actually get. Leave this off for the first
  # month and let the deadline calendar carry the channel.
  #
  # To turn it on later: set enabled to true. The locations list below is
  # already narrowed to LA and the South Bay, because local aerospace does
  # hire from community colleges and nationwide big tech mostly does not.
  - type: simplify
    label: Simplify
    enabled: false
    url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
    max_age_days: 8
    categories:
      - Hardware
      - AI/ML/Data
    terms:                 # leave empty to accept every term
      - Summer 2027
      - Fall 2026
      - Spring 2027
    title_keywords:        # a posting must contain at least one of these
      - electrical
      - hardware
      - embedded
      - firmware
      - robotics
      - controls
      - rf
      - analog
      - fpga
      - test engineer
      - systems engineer
      - research
      - aerospace
      - mechanical
    title_blocklist:       # never post these
      - senior
      - staff
      - principal
      - manager
      - phd
      - graduate
    degrees:               # a posting with no degree listed still passes
      - Associate's
      - Bachelor's
    locations:             # LA and the South Bay only. Empty means nationwide.
      - Los Angeles
      - Pasadena
      - El Segundo
      - Long Beach
      - Torrance
      - Redondo Beach
      - Hawthorne
      - Burbank
      - Van Nuys
      - Northridge
      - Woodland Hills
      - Santa Monica
      - Remote
    location_blocklist:
      - Canada
      - India
      - United Kingdom
      - Israel
      - Taiwan

  # Generic RSS. Add any program blog or lab news page that publishes a feed.
  # Verify a feed in a browser before enabling it, plenty of these go stale.
  - type: rss
    label: Example program feed
    enabled: false
    kind: research
    url: https://example.edu/undergrad-research/feed
    max_age_days: 14
    keywords:
      - undergraduate
      - REU
      - internship
      - fellowship
